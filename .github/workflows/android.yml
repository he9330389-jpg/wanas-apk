name: Build WANAS - FIXED LOGIN + SAFE AREA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Fix Login + Safe Area
        run: |
          unzip -o WANAS-COMPLETE.zip
          if [ -d "WANAS-COMPLETE" ]; then mv WANAS-COMPLETE/* .; mv WANAS-COMPLETE/.* . 2>/dev/null || true; fi
          rm -rf WANAS-COMPLETE.zip __MACOSX android
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.wanas.globalfinal2",
            "appName": "WANAS",
            "webDir": "dist",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#121212"
              }
            }
          }
          EOF
          # هنا الحل - بنحط VITE_API_ORIGIN مش VITE_API_URL
          echo "VITE_API_ORIGIN=https://wanas-apk-global.vercel.app" > .env
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          echo "VITE_API_URL=https://wanas-apk-global.vercel.app" >> .env
          echo "VITE_SERVER_URL=https://wanas-apk-global.vercel.app" >> .env
          echo "DATABASE_URL=postgresql://postgres:%40Wanas1234567890qw@db.urlppfobxllsdconvgff.supabase.co:5432/postgres" >> .env
          cat .env
          # إصلاح المنطقة الآمنة
          echo "
          :root { --safe-area-inset-top: env(safe-area-inset-top); --safe-area-inset-bottom: env(safe-area-inset-bottom); }
          body { padding-top: env(safe-area-inset-top) !important; padding-bottom: env(safe-area-inset-bottom) !important; }
          #root { padding-top: calc(env(safe-area-inset-top) + 12px) !important; }
          .toast-message { max-width: 90vw !important; left: 50% !important; transform: translateX(-50%) !important; bottom: 90px !important; }
          " >> src/index.css
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/status-bar --legacy-peer-deps
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-FIXED-LOGIN-SAFEAREA
          path: android/app/build/outputs/apk/debug/app-debug.apk
