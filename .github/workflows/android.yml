name: Build WANAS - FIXED BUILD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Fix Banners Safely
        run: |
          unzip -o WANAS-COMPLETE.zip 2>/dev/null || unzip -o wanas-complete-*.zip 2>/dev/null || true
          [ -d "WANAS-COMPLETE" ] && cp -r WANAS-COMPLETE/* . 2>/dev/null || true
          [ -d "wanas-final-corrected" ] && cp -r wanas-final-corrected/* . 2>/dev/null || true
          rm -rf __MACOSX android WANAS-COMPLETE *.zip wanas-final-corrected
          
          python3 << 'PY'
          import pathlib, re
          # App.tsx - شيل البانر الأصفر بس من غير ما نلمس اسم المتغير
          for p in [pathlib.Path("src/App.tsx"), pathlib.Path("src/App_1.tsx")]:
              if p.exists():
                  t = p.read_text(encoding='utf-8', errors='ignore')
                  # شيل بلوك البانر الأصفر كله
                  t = re.sub(r"\{showOfflineBanner && getWsUrl\(\) && \([\s\S]*?<\/div>\s*\)\}\)", "{null}", t)
                  p.write_text(t, encoding='utf-8')
                  print(f"Fixed yellow in {p}")
          
          # MajlisRoomsView - شيل البانر الأحمر
          for p in [pathlib.Path("src/components/MajlisRoomsView.tsx"), pathlib.Path("src/components/MajlisRoomsView_1.tsx")]:
              if p.exists():
                  t = p.read_text(encoding='utf-8', errors='ignore')
                  t = re.sub(r"\{!isConnected && \([\s\S]*?انقطع الاتصال[\s\S]*?<\/div>\s*\)\}\)", "{null}", t)
                  p.write_text(t, encoding='utf-8')
                  print(f"Fixed red in {p}")
          PY
          
          cat > src/utils/mediaUtils.ts << 'EOF'
          const API_ORIGIN: string = ((import.meta.env?.VITE_API_ORIGIN as string | undefined) || '').replace(/\/+$/, '');
          export function getApiUrl(path: string): string { if (API_ORIGIN) return `${API_ORIGIN}${path}`; return path; }
          export function getWsUrl(): string { return ''; }
          export async function compressImageSource(s: string, a:number,b:number): Promise<string> { return s; }
          export async function readFileAsCompressedDataUrl(file: File, k:any): Promise<string> { return new Promise((r)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result as string); rd.readAsDataURL(file); }); }
          export function downloadMediaToDevice(a:string,b:string): void {}
          export async function readMediaFileWithDuration(file: File, k:any): Promise<any> { return {dataUrl:'',duration:'0:15',fileName:file.name}; }
          EOF
          
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.wanas.finalfixed2025",
            "appName": "WANAS",
            "webDir": "dist",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#121212"
              }
            }
          }
          EOF
          
          echo "VITE_API_ORIGIN=https://wanas-apk-global.vercel.app" > .env
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          
          cat >> src/index.css << 'EOF'
          :root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
          body{padding-top:var(--sat)!important;background:#121212!important}
          #root{padding-top:calc(var(--sat) + 8px)!important}
          EOF
          
          echo "=== CHECK ==="
          grep -c "غير متصل بالسيرفر" src/App.tsx && echo "Still there" || echo "YELLOW REMOVED ✅"
          grep -c "انقطع الاتصال" src/components/MajlisRoomsView.tsx && echo "Still there" || echo "RED REMOVED ✅"
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/status-bar --legacy-peer-deps || true
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-FIXED-BUILD
          path: android/app/build/outputs/apk/debug/app-debug.apk
