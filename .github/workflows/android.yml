name: Build WANAS - FINAL NO BANNER
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Remove All Banners + Safe Area Fix
        run: |
          unzip -o WANAS-COMPLETE.zip 2>/dev/null || unzip -o wanas-complete-【entity-github¦canonical_name=GitHub】-ready.zip 2>/dev/null || true
          [ -d "WANAS-COMPLETE" ] && mv WANAS-COMPLETE/* . && mv WANAS-COMPLETE/.* . 2>/dev/null || true
          [ -d "wanas-final-corrected" ] && cp -r wanas-final-corrected/* . 2>/dev/null || true
          rm -rf __MACOSX android WANAS-COMPLETE WANAS-COMPLETE.zip wanas-complete-【entity-github¦canonical_name=GitHub】-ready.zip wanas-final-corrected
          
          # === إزالة الرسالة الصفراء نهائيا من App.tsx ===
          sed -i 's/{showOfflineBanner && getWsUrl() && (/ {false \&\& (/g' src/App.tsx || true
          sed -i 's/{showOfflineBanner && getWsUrl() && (/ {false \&\& (/g' src/App_1.tsx 2>/dev/null || true
          
          # === إزالة الرسالة الحمراء من المجالس ===
          sed -i 's/{!isConnected && (/ {false \&\& (/g' src/components/MajlisRoomsView.tsx || true
          sed -i 's/{!isConnected && (/ {false \&\& (/g' src/components/MajlisRoomsView_1.tsx 2>/dev/null || true
          
          # === إصلاح WebSocket - ميحاولش يتصل ===
          cat > src/utils/mediaUtils.ts << 'EOF'
          const API_ORIGIN: string = ((import.meta.env?.VITE_API_ORIGIN as string | undefined) || '').replace(/\/+$/, '');
          function isNativeShell(): boolean { return true; }
          export function getApiUrl(path: string): string { if (API_ORIGIN) return `${API_ORIGIN}${path}`; return path; }
          export function getWsUrl(): string { return ''; }
          export async function compressImageSource(s: string, a:number,b:number): Promise<string> { return s; }
          export async function readFileAsCompressedDataUrl(file: File, kind: any): Promise<string> { return new Promise((r)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result as string); rd.readAsDataURL(file); }); }
          export function downloadMediaToDevice(a:string,b:string): void {}
          export async function readMediaFileWithDuration(file: File, kind: any): Promise<any> { return {dataUrl:'',duration:'0:15',fileName:file.name}; }
          EOF
          
          # === كرت البروفايل - تصغيره ===
          # هنصغر الغلاف من  h-64 لـ h-36
          sed -i 's/h-\[.*\]/h-36/g; s/min-h-\[.*\]/min-h-[144px]/g' src/components/ProfileView.tsx 2>/dev/null || true
          
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.wanas.finalnobanner",
            "appName": "WANAS",
            "webDir": "dist",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#121212"
              }
            }
          }
          EOF
          
          echo "VITE_API_ORIGIN=https://wanas-apk-global.vercel.app" > .env
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          
          echo ":root{--safe-area-inset-top:env(safe-area-inset-top)} body{padding-top:env(safe-area-inset-top)!important} #root{padding-top:calc(env(safe-area-inset-top) + 8px)!important} .toast-message{max-width:90vw!important;left:50%!important;transform:translateX(-50%)!important;bottom:100px!important}" >> src/index.css
          
          echo "=== Checking banners removed ==="
          grep -n "غير متصل بالسيرفر" src/App.tsx || echo "Yellow banner REMOVED OK"
          grep -n "انقطع الاتصال" src/components/MajlisRoomsView.tsx || echo "Red banner REMOVED OK"
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/status-bar --legacy-peer-deps || true
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-FINAL-NO-BANNER
          path: android/app/build/outputs/apk/debug/app-debug.apk
