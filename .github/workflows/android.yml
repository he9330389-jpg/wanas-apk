name: Build WANAS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Setup Env
        run: |
          unzip -o WANAS-COMPLETE.zip
          if [ -d "WANAS-COMPLETE" ]; then mv WANAS-COMPLETE/* .; mv WANAS-COMPLETE/.* . 2>/dev/null || true; fi
          rm -rf WANAS-COMPLETE WANAS-COMPLETE.zip
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fix Password Validation + Build
        run: |
          npm install --legacy-peer-deps
          # تصليح مشكلة الباسورد لازم يكون أكتر من 6 - نخليها 3
          find src -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/.length > 6/.length >= 3/g' || true
          find src -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/minLength: 6/minLength: 3/g' || true
          find src -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/minimum 6/minimum 3/g' || true
          npm run build
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-FULL-15MB-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
