name: Build WANAS - NO BANNER + SAFE AREA FIX
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Fix All Issues
        run: |
          unzip -o WANAS-COMPLETE.zip || unzip -o wanas-complete-【entity-github¦canonical_name=GitHub】-ready.zip
          if [ -d "WANAS-COMPLETE" ]; then mv WANAS-COMPLETE/* .; mv WANAS-COMPLETE/.* . 2>/dev/null || true; fi
          if [ -d "wanas-final-corrected" ]; then mv wanas-final-corrected/* . 2>/dev/null || true; fi
          rm -rf __MACOSX android wanas-final-corrected WANAS-COMPLETE.zip wanas-complete-github-ready.zip
          
          # 1. إصلاح WebSocket - عشان الرسالة الصفراء تختفي
          cat > src/utils/mediaUtils.ts << 'EOF'
          const API_ORIGIN: string = ((import.meta.env?.VITE_API_ORIGIN as string | undefined) || '').replace(/\/+$/, '');
          function isNativeShell(): boolean {
            if (typeof window === 'undefined') return false;
            const p = window.location.protocol;
            return p === 'file:' || p === 'capacitor:' || p === 'ionic:';
          }
          export function getApiUrl(path: string): string {
            if (API_ORIGIN) return `${API_ORIGIN}${path}`;
            return path;
          }
          export function getWsUrl(): string {
            if (typeof window === 'undefined') return '';
            if (isNativeShell()) return '';
            if (API_ORIGIN) return '';
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}`;
          }
          export async function compressImageSource(src: string, maxWidth: number, maxHeight: number, quality = 0.88, zoom = 1, offsetY = 0): Promise<string> { return src; }
          export async function readFileAsCompressedDataUrl(file: File, kind: 'avatar' | 'cover' | 'post'): Promise<string> { return new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result as string); r.readAsDataURL(file); }); }
          export function downloadMediaToDevice(mediaUrl: string, defaultName = 'wanas-media'): void {}
          export async function readMediaFileWithDuration(file: File, kind: 'video' | 'audio'): Promise<{ dataUrl: string; duration: string; fileName: string }> { return {dataUrl:'', duration:'0:15', fileName:file.name}; }
          export function formatSeconds(sec: number): string { return '0:15'; }
          EOF
          
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.wanas.globalfinal3",
            "appName": "WANAS",
            "webDir": "dist",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#121212"
              }
            }
          }
          EOF
          
          echo "VITE_API_ORIGIN=https://wanas-apk-global.vercel.app" > .env
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          
          # إصلاح المنطقة الآمنة + التوست
          echo ":root{--safe-area-inset-top:env(safe-area-inset-top);--safe-area-inset-bottom:env(safe-area-inset-bottom)} body{padding-top:env(safe-area-inset-top)!important;padding-bottom:env(safe-area-inset-bottom)!important;background:#121212;margin:0} #root{padding-top:calc(env(safe-area-inset-top) + 12px)!important} .toast-message{max-width:90vw!important;left:50%!important;transform:translateX(-50%)!important;bottom:90px!important;white-space:normal!important}" >> src/index.css
          
          cat .env
          cat src/utils/mediaUtils.ts
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/status-bar --legacy-peer-deps
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-NO-BANNER-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
