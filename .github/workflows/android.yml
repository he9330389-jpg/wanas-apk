name: Build WANAS APK - FINAL GLOBAL
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Setup Global Server
        run: |
          rm -rf android dist node_modules
          unzip -o WANAS-COMPLETE.zip
          if [ -d "WANAS-COMPLETE" ]; then mv WANAS-COMPLETE/* .; mv WANAS-COMPLETE/.* . 2>/dev/null || true; fi
          rm -rf WANAS-COMPLETE WANAS-COMPLETE.zip __MACOSX
          echo "VITE_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Bf--VPuQC323eob492vUVg_syT4Zzk9" >> .env
          echo "VITE_API_URL=https://wanas-apk-global.vercel.app" >> .env
          echo "VITE_SERVER_URL=https://wanas-apk-global.vercel.app" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "SUPABASE_URL=https://urlppfobxllsdconvgff.supabase.co" >> .env
          echo "DATABASE_URL=postgresql://postgres:%40Wanas1234567890qw@db.urlppfobxllsdconvgff.supabase.co:5432/postgres" >> .env
          cat .env
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Global APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WANAS-FINAL-GLOBAL-20MB
          path: android/app/build/outputs/apk/debug/app-debug.apk
