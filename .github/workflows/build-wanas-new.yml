name: Build WANAS - NEW
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Fix Icons - Copy black W to Android
        run: |
          echo "Copying black W icons..."
          cp assets/icon-only.png android/app/src/main/res/drawable/ic_launcher.png || true
          cp assets/icon-only.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/icon-only.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/icon-only.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp -r assets/android-res/* android/app/src/main/res/ || echo "copy android-res done"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wanas-apk-new
          path: android/app/build/outputs/apk/debug/app-debug.apk
